<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mon Patrimoine PWA - Ultimate Refined</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f172a; color: #f8fafc; padding: 16px; padding-bottom: 85px; touch-action: pan-y; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .brand-title { font-size: 20px; font-weight: 700; color: #38bdf8; letter-spacing: -0.5px; }
    .header-actions { display: flex; gap: 8px; }
    .action-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    /* Écran de Verrouillage PIN */
    #lockScreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0f172a; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; }
    .lock-box { background: #1e293b; border: 1px solid #334155; padding: 24px; border-radius: 20px; width: 100%; max-width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .pin-input { font-size: 24px; letter-spacing: 12px; text-align: center; width: 160px; padding: 8px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; margin-bottom: 16px; }

    /* Bottom Navigation Bar */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border-top: 1px solid #334155; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
    .nav-item { background: none; border: none; color: #64748b; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; width: 25%; }
    .nav-item .icon { font-size: 18px; }
    .nav-item.active { color: #38bdf8; font-weight: 600; }

    .tab-view { display: none; }
    .tab-view.active { display: block; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(8px); border-radius: 16px; padding: 16px; margin-bottom: 14px; border: 1px solid rgba(255, 255, 255, 0.05); }
    h2 { font-size: 15px; font-weight: 600; color: #f8fafc; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    
    .hero-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .hero-amount { font-size: 30px; font-weight: 800; color: #38bdf8; margin: 4px 0; letter-spacing: -1px; }
    .hero-sub { font-size: 12px; color: #64748b; }

    .kpi-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .kpi-box { background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 12px; }
    .kpi-box-title { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
    .kpi-box-value { font-size: 13px; font-weight: bold; color: #f8fafc; margin: 2px 0 6px 0; }
    .progress-bg { background: #1e293b; height: 4px; border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 2px; }

    /* Market Grid Widget */
    .market-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .market-card { background: #0f172a; border: 1px solid #334155; padding: 8px; border-radius: 10px; text-align: center; }
    .market-title { font-size: 10px; color: #94a3b8; }
    .market-val { font-size: 12px; font-weight: bold; color: #38bdf8; margin-top: 2px; }
    .market-sub { font-size: 9px; color: #34d399; }

    .fire-metric { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #334155; }
    .fire-metric:last-child { border-bottom: none; }
    .fire-label { font-size: 13px; color: #94a3b8; }
    .fire-val { font-size: 14px; font-weight: bold; color: #34d399; }

    label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 2px; }
    input, select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #fff; margin-bottom: 8px; font-size: 13px; }
    button.submit-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background-color: #2563eb; color: #fff; font-weight: bold; font-size: 14px; cursor: pointer; }
    
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 10px 4px; border-bottom: 1px solid #334155; vertical-align: middle; }
    th { color: #64748b; font-weight: normal; }
    .action-icon-btn { background: none; border: none; font-size: 14px; cursor: pointer; padding: 2px 6px; }
    .delete-btn { color: #ef4444; }
    .edit-btn { color: #38bdf8; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

    .info-banner { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 10px; padding: 10px; font-size: 11px; color: #38bdf8; margin-bottom: 12px; }

    #chartModal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.96); z-index: 9999; padding: 20px; flex-direction: column; justify-content: center; align-items: center; }
    .modal-close { position: absolute; top: 20px; right: 20px; background: #334155; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- ÉCRAN DE VERROUILLAGE PIN -->
  <div id="lockScreen" style="display:none;">
    <div class="lock-box">
      <div style="font-size:32px; margin-bottom:8px;">🔒</div>
      <div style="font-size:16px; font-weight:bold; color:#38bdf8; margin-bottom:4px;">Accès Sécurisé</div>
      <div style="font-size:12px; color:#94a3b8; margin-bottom:16px;">Entrez votre code PIN (par défaut : 1234)</div>
      <input type="password" id="pinInput" class="pin-input" maxlength="4" pattern="[0-9]*" inputmode="numeric">
      <button class="submit-btn" onclick="validatePin()">Déverrouiller</button>
    </div>
  </div>

  <!-- MODAL AGRANDISSEMENT GRAPHIQUE -->
  <div id="chartModal">
    <button class="modal-close" onclick="closeChartModal()">✕ Fermer</button>
    <div style="width:100%; max-width:650px; padding: 10px;">
      <h2 style="text-align:center; margin-bottom:16px; color:#38bdf8;">Zoom Trajectoire FIRE</h2>
      <canvas id="modalProjectionChart" height="320"></canvas>
    </div>
  </div>

  <!-- HEADER -->
  <div class="header-bar">
    <div class="brand-title">Mon Patrimoine</div>
    <div class="header-actions">
      <button class="action-btn" onclick="lockApp()">🔒 Verrouiller</button>
      <button class="action-btn" onclick="togglePrivacyMode()">
        <span id="privacyIcon">👁️</span> <span id="privacyText">Masquer</span>
      </button>
    </div>
