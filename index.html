<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi Patrimoine</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 16px; padding-bottom: 80px; }
    h1, h2 { color: #f8fafc; margin-bottom: 12px; }
    .card { background-color: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
    label { display: block; font-size: 14px; color: #94a3b8; margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #fff; margin-bottom: 12px; font-size: 16px; }
    button { width: 100%; padding: 12px; border-radius: 8px; border: none; background-color: #2563eb; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; }
    button:active { background-color: #1d4ed8; }
    .total-val { font-size: 28px; font-weight: bold; color: #38bdf8; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; font-weight: normal; }
    .delete-btn { background: none; border: none; color: #ef4444; width: auto; padding: 0; font-size: 14px; }
  </style>
</head>
<body>

  <h1>Suivi de Patrimoine</h1>

  <!-- CARTE PATRIMOINE TOTAL -->
  <div class="card">
    <label>Patrimoine Total Actuel</label>
    <div id="totalPatrimoine" class="total-val">0,00 €</div>
  </div>

  <!-- GRAPHIQUE D'ÉVOLUTION TEMPORELLE -->
  <div class="card">
    <h2>Évolution Temporelle</h2>
    <canvas id="evolutionChart" height="200"></canvas>
  </div>

  <!-- FORMULAIRE DE SAISIE -->
  <div class="card">
    <h2>Saisir un Relevé</h2>
    <form id="entryForm">
      <label for="entryDate">Date du relevé</label>
      <input type="date" id="entryDate" required>

      <label for="assetCategory">Enveloppe / Actif</label>
      <select id="assetCategory" required>
        <option value="Linxea Spirit 2">Linxea Spirit 2 (AV)</option>
        <option value="Louve Infinity">Louve Infinity (AV)</option>
        <option value="Louve Invest Direct">Louve Invest (SCPI Direct)</option>
        <option value="PEA">PEA</option>
        <option value="PEG / PERCO">PEG / PERCO</option>
        <option value="Assurance-Vie Autre">Autre Assurance-Vie</option>
        <option value="Liquidités / Comptes">Liquidités / Comptes</option>
        <option value="Autre">Autre</option>
      </select>

      <label for="assetValue">Valeur (€)</label>
      <input type="number" id="assetValue" placeholder="ex: 15000" step="0.01" required>

      <button type="submit">Enregistrer la valeur</button>
    </form>
  </div>

  <!-- HISTORIQUE DES SAISIES -->
  <div class="card">
    <h2>Historique des relevés</h2>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Support</th>
          <th>Valeur</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="historyTable"></tbody>
    </table>
  </div>

  <script>
    // Initialisation de la date du jour par défaut
    document.getElementById('entryDate').valueAsDate = new Date();

    let records = JSON.parse(localStorage.getItem('patrimoine_records')) || [];
    let chartInstance = null;

    const form = document.getElementById('entryForm');
    const historyTable = document.getElementById('historyTable');
    const totalDisplay = document.getElementById('totalPatrimoine');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const date = document.getElementById('entryDate').value;
      const category = document.getElementById('assetCategory').value;
      const value = parseFloat(document.getElementById('assetValue').value);

      records.push({ id: Date.now(), date, category, value });
      saveAndRefresh();
      form.reset();
      document.getElementById('entryDate').valueAsDate = new Date();
    });

    function deleteRecord(id) {
      records = records.filter(r => r.id !== id);
      saveAndRefresh();
    }

    function saveAndRefresh() {
      // Tri par date
      records.sort((a, b) => new Date(a.date) - new Date(b.date));
      localStorage.setItem('patrimoine_records', JSON.stringify(records));
      renderHistory();
      renderChart();
    }

    function renderHistory() {
      historyTable.innerHTML = '';
      let latestByCat = {};

      records.forEach(r => {
        latestByCat[r.category] = r.value;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.date}</td>
          <td>${r.category}</td>
          <td>${r.value.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' })}</td>
          <td><button class="delete-btn" onclick="deleteRecord(${r.id})">✕</button></td>
        `;
        historyTable.prepend(tr);
      });

      // Calcul du total basé sur la dernière valeur connue de chaque support
      const total = Object.values(latestByCat).reduce((a, b) => a + b, 0);
      totalDisplay.innerText = total.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
    }

    function renderChart() {
      const ctx = document.getElementById('evolutionChart').getContext('2d');
      
      // Grouper le patrimoine total cumulé par date
      let datesMap = {};
      let currentValues = {};

      records.forEach(r => {
        currentValues[r.category] = r.value;
        const dayTotal = Object.values(currentValues).reduce((a, b) => a + b, 0);
        datesMap[r.date] = dayTotal;
      });

      const labels = Object.keys(datesMap);
      const dataValues = Object.values(datesMap);

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Patrimoine Total (€)',
            data: dataValues,
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
          }
        }
      });
    }

    // Chargement initial
    saveAndRefresh();
  </script>
</body>
</html>
"Version deux de l'app de patrimoine"
